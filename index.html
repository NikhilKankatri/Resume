<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Download</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#fff;
    width:400px;
    padding:40px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

h1{
    color:#333;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:30px;
}

.download-btn{
    display:inline-block;
    text-decoration:none;
    background:#007BFF;
    color:#fff;
    padding:15px 30px;
    border-radius:8px;
    font-size:18px;
    transition:.3s;
}

.download-btn:hover{
    background:#0056b3;
}
</style>

</head>
<body>

<div class="card">
    <h1>My Resume</h1>
    <p>Click the button below to download my resume.</p>

    <a href="resume.pdf" download="Nikhil_Kankatri_Resume.pdf" class="download-btn">
        📄 Download Resume
    </a>
</div>

</body>
</html>
