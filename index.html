<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .container{
            text-align:center;
            background:#fff;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            color:#333;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            padding:12px 25px;
            background:#007BFF;
            color:white;
            text-decoration:none;
            border-radius:5px;
            font-size:18px;
            transition:.3s;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Resume</h1>

    <a href="resume.pdf" download class="btn">
        📄 Download Resume
    </a>
</div>

</body>
</html>
